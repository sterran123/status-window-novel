<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상태창이 뜬 날 — 권지혁 이야기</title>
<link rel="stylesheet" href="novel.css">
</head>
<body>
<header class="topbar">
  <div class="brand">상태창이 뜬 날<em>권지혁 이야기</em></div>
  <nav class="topnav">
    <button id="btn-auto" title="자동 재생 켜기/끄기">⏸ 자동</button>
    <button id="btn-restart" title="처음부터">↺ 처음부터</button>
    <button id="btn-status" title="상태창">▦ 상태창</button>
    <button id="btn-settings" title="설정">⚙ 설정</button>
    <a id="btn-manuscript" href="../manuscript.md" download>원고 받기</a>
  </nav>
</header>
<div class="progress"><i id="progress-bar"></i></div>

<main class="chat-wrap">
  <div id="chat" class="chat" aria-live="polite"></div>
  <div id="choices" class="choices"></div>
  <button id="btn-next" class="next-btn">다음 ▸</button>
</main>

<aside id="status-panel" class="status-panel" hidden>
  <div class="status-card">
    <h3>[ STATUS — 상태창 ]</h3>
    <div class="sub">권지혁의 시스템 창 · 가장 최근 기록을 표시합니다</div>
    <pre id="status-body"></pre>
    <button id="btn-close-status">닫기</button>
  </div>
</aside>

<aside id="settings-panel" class="modal" hidden>
  <div class="modal-card">
    <h3>⚙ 설정</h3>
    <div class="set-row">
      <span class="set-label">진행 방식</span>
      <div class="seg">
        <button id="set-auto">자동</button>
        <button id="set-manual">수동</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">테마</span>
      <div class="seg">
        <button id="set-dark">다크</button>
        <button id="set-light">라이트</button>
      </div>
    </div>
    <div class="set-note" id="set-note"></div>
    <button id="btn-close-settings">닫기</button>
  </div>
</aside>

<aside id="resume-panel" class="modal" hidden>
  <div class="modal-card">
    <h3>📖 읽던 자리가 있습니다</h3>
    <p id="resume-info" class="resume-info"></p>
    <button id="btn-resume" class="primary">이어보기</button>
    <button id="btn-fresh" class="ghost">처음부터</button>
  </div>
</aside>

<script src="novel.js"></script>
</body>
</html>
